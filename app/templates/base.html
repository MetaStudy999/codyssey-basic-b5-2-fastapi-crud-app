<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}메모 보드{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px; line-height: 1.6; }
    nav { display: flex; gap: 12px; margin-bottom: 28px; }
    a { color: #1f5fbf; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
    textarea { min-height: 180px; }
    button { padding: 9px 14px; cursor: pointer; }
    .error { border: 1px solid #b42318; background: #fff1f0; padding: 10px; border-radius: 6px; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <nav>
    <a href="/">홈</a>
    <a href="/memos">메모 목록</a>
    <a href="/memos/new">새 메모</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
