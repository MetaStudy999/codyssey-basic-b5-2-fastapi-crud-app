{% extends "base.html" %}
{% block title %}{{ memo.title }}{% endblock %}
{% block content %}
<h1>{{ memo.title }}</h1>
<div class="card">
  <p><strong>ID:</strong> {{ memo.id }}</p>
  <p><strong>내용:</strong></p>
  <p>{{ memo.content }}</p>
  <p><strong>작성일시:</strong> {{ memo.created_at.strftime('%Y-%m-%d %H:%M:%S') }}</p>
</div>
<div class="actions">
  <a href="/memos/{{ memo.id }}/edit">수정</a>
  <form method="post" action="/memos/{{ memo.id }}/delete">
    <button type="submit">삭제</button>
  </form>
  <a href="/memos">목록으로</a>
</div>
{% endblock %}
