{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<h1>{{ page_title }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ action }}">
  <label for="title">제목</label>
  <input id="title" name="title" maxlength="120" required value="{{ memo.title if memo else '' }}">

  <label for="content">내용</label>
  <textarea id="content" name="content" required>{{ memo.content if memo else '' }}</textarea>

  <div class="actions">
    <button type="submit">저장</button>
    <a href="/memos/">취소</a>
  </div>
</form>
{% endblock %}
