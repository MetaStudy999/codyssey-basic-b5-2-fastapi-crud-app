<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}B5-2 Memo{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 0 auto; padding: 24px; line-height: 1.6; }
    nav { display: flex; gap: 12px; margin-bottom: 24px; }
    form { display: grid; gap: 12px; }
    input, textarea, button { font: inherit; padding: 8px; }
    textarea { min-height: 180px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .error { color: #b00020; font-weight: 700; }
    article { border: 1px solid #ddd; padding: 16px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <nav>
    <a href="/">홈</a>
    <a href="/memos/">메모 목록</a>
    <a href="/memos/new">메모 등록</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
